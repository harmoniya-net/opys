name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Holds the tree to scripts/architecture/rules.mjs: the dependency DAG of
  # crates and packages, the walls across it, one addon with a namespace per crate, and the
  # hand-kept lists that remain. Reads manifests and sources only, so it needs
  # nothing built and runs first.
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:architecture
      - run: npm run architecture
      # The release only runs once everything here has passed, so the pieces
      # of it that can fail early are run here: the publish order resolves,
      # and a version stamps into every manifest it should.
      - run: node scripts/release/crates.mjs
      - run: node scripts/release/stamp.mjs 99.0.0 && cargo metadata --format-version 1 > /dev/null

  cargo:
    name: Cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-linux
      # Both used to run only in the pre-commit hook, which a commit from
      # another machine, or one made with --no-verify, never sees.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # The cleanup/extract path handling branches on `\` vs `/` and case-folds on
  # Windows; only a real Windows filesystem walk exercises that end to end.
  cargo-windows:
    name: Cargo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-windows
      - run: cargo test -p opys-runtime --locked

  node:
    name: TS build + typecheck + test
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-napi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the napi `.node` for the host (linux-x64-gnu) so the TS
      # packages can `require` it during typecheck and test.
      - run: npm run build --workspace=@opys/binding
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck
      - run: npm test

  # A push to `main` that passed everything above is released. One at a
  # time: a second push waits for the first, so two never work out the same
  # version.
  release:
    name: Release
    needs: [architecture, cargo, cargo-windows, node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
