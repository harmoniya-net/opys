name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the release workflow: on the release PR's branch, which GitHub
  # will not run this for on its own (a push made with the workflow token
  # triggers nothing), and again on the release commit before publishing.
  workflow_call:
    inputs:
      ref:
        description: What to check out. Empty is the commit that triggered the caller.
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # Holds the tree to scripts/architecture/rules.mjs: the dependency DAG of
  # crates and packages, the walls across it, one binding per crate, and the
  # hand-kept lists that remain. Reads manifests and sources only, so it needs
  # nothing built and runs first.
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:architecture
      - run: npm run architecture
      # The release workflow only runs on a tag, so the one piece of it that
      # can be exercised on every push is: the publish order still resolves.
      - run: node scripts/release/crates.mjs
      # Every package and crate is released together, at one version.
      - run: npm run versions

  cargo:
    name: Cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-linux
      # Both used to run only in the pre-commit hook, which a commit from
      # another machine, or one made with --no-verify, never sees.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # The sweep/extract path handling branches on `\` vs `/` and case-folds on
  # Windows; only a real Windows filesystem walk exercises that end to end.
  cargo-windows:
    name: Cargo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-windows
      - run: cargo test -p opys-runtime --locked

  node:
    name: TS build + typecheck + test
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-napi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the napi `.node` for the host (linux-x64-gnu) so the TS
      # packages can `require` it during typecheck and test.
      - run: npm run build --workspace=@opys/core-binding --workspace=@opys/runtime-binding
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck
      - run: npm test
