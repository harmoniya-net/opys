name: Release

# Called by CI on a push to `main`, once every check has passed: there is no
# release that was not tested, and no step somebody has to remember.
#
# The version is told from the commits since the last release
# (`scripts/release/bump.mjs`), stamped into this checkout and committed
# nowhere: the tag made at the end is the record. A push that changes nothing
# a package ships (docs, tests, CI) releases nothing.
#
# Every publish skips what is already published, so a release that failed
# halfway is finished by running it again. The tag comes last for the same
# reason: until it exists the next run works out the same version.
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: true

env:
  CARGO_TERM_COLOR: always
  DEBUG: napi:*
  APP_NAME: opys

jobs:
  # ─────────────────────────────────────────────────────────────
  # 0. Which version, if any.
  # ─────────────────────────────────────────────────────────────
  plan:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # The whole history and its tags: the version is told from the commits
      # since the last one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: next
        run: echo "version=$(node scripts/release/next.mjs)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # 1. Cross-build the napi `.node` for every published target.
  # ─────────────────────────────────────────────────────────────
  build-napi:
    name: napi (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # musl targets have no apt-installable cross-toolchain on Ubuntu
          # (unlike the gnu aarch64 target below) — cross-linked via Zig
          # instead (see the "Setup Zig" step).
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # Both darwin targets cross-compile on macos-14 (arm64 host). macos-13
          # queue availability is unreliable; the macOS SDK is universal, so
          # `--target x86_64-apple-darwin` builds fine from an arm64 host.
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: napi-${{ matrix.target }}

      # Cross-link for aarch64 Linux from x86_64 Ubuntu.
      - name: Install aarch64 Linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Zig bundles musl sysroots for every arch, so it cross-links both
      # musl targets uniformly without per-arch musl gcc toolchains. Fetched
      # directly rather than via a setup-zig action: those build the
      # download URL as `zig-<os>-<arch>-<ver>.tar.xz`, but upstream renamed
      # release tarballs to `zig-<arch>-<os>-<ver>.tar.xz` as of 0.16.0,
      # so every mirror 404s until the action catches up.
      - name: Setup Zig
        if: contains(matrix.target, '-musl')
        run: |
          curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - run: npm ci --ignore-scripts

      # Before the build: a crate reads its own version as it compiles.
      - run: node scripts/release/stamp.mjs ${{ needs.plan.outputs.version }}

      # One addon holds every crate that has a JS surface, so there is one
      # thing to build per target.
      - name: Build the addon
        shell: bash
        working-directory: crates/opys-napi
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ contains(matrix.target, '-musl') && '--zig' || '' }}

      - name: Upload the addon
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: crates/opys-napi/*.node
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2. Publish to npm: TS workspaces + per-platform napi packages.
  # ─────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: [plan, build-napi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: node scripts/release/stamp.mjs ${{ needs.plan.outputs.version }}

      # Every target's `.node`, side by side in one directory.
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: crates/opys-napi/artifacts
          merge-multiple: true

      # The `npm/<target>/` per-platform sub-package scaffolding is checked
      # into git (see `crates/opys-napi/npm/`). `napi artifacts` walks
      # `./artifacts` (the filename encodes the target) and routes each
      # `.node` into the matching `npm/<target>/` directory.
      - name: Route .node files into per-platform sub-packages
        working-directory: crates/opys-napi
        run: |
          set -euo pipefail
          # Nothing built is a release that would publish an empty package.
          ls artifacts/*.node > /dev/null
          npx napi artifacts
          ls -R npm

      # Build TS workspaces against the host `.node` so tsdown produces
      # dist/ before anything is published.
      - run: npm run build --workspaces --if-present

      # The addon's platform packages, then every workspace in dependency
      # order, each skipped if this version of it is already published.
      - name: Publish every package not yet on npm
        run: node scripts/release/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 3. Publish to crates.io. Workspaces publish bottom-up.
  # ─────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [plan, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: node scripts/release/stamp.mjs ${{ needs.plan.outputs.version }}

      # The order is derived from the dependency graph, every crate after
      # the ones it depends on — see `scripts/release/order.mjs`. `cargo
      # publish` since 1.66 waits for crates.io indexing between packages, so
      # a sequential publish in that order just works. A crate whose version
      # is already there is skipped, so a second run finishes a first.
      # `--allow-dirty`: the stamp is in the tree and in no commit.
      - name: Publish every crate not yet on crates.io, dependencies first
        run: |
          set -euo pipefail
          for crate in $(node scripts/release/crates.mjs); do
            echo "::group::$crate"
            if curl -sf -o /dev/null -A "opys-release (github.com/harmoniya-net/opys)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION: already published"
            else
              cargo publish -p "$crate" --allow-dirty
            fi
            echo "::endgroup::"
          done
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 4. Tag what was published. Last: the tag is what says a release is
  #    whole, and what the next one counts its commits from.
  # ─────────────────────────────────────────────────────────────
  tag:
    name: Tag the release
    needs: [plan, publish-npm, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create the tag and its GitHub release
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION: already released"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
