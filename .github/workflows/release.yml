name: Release

# How a release happens:
#
#   1. Every push to main, release-please reads the commits since the last
#      release and keeps one pull request open: the next version, chosen from
#      what those commits say they are (`fix:` → patch, `feat:` → minor, a
#      `!` or BREAKING CHANGE → minor while we are 0.x), and the changelog.
#   2. It bumps the root `package.json` and nothing else. `stamp` fans that
#      version out to every package, every crate and both lockfiles, on the
#      PR's branch, and CI is run on the result.
#   3. Merging the PR is the release. release-please tags it and writes the
#      GitHub release; CI runs once more on that commit; then everything is
#      published.
#
# Nothing here runs on anyone's machine.

on:
  push:
    branches: [main]

# One at a time: two pushes in quick succession must not both rewrite the PR.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Empty unless a release PR was opened or updated by this run.
      branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please knows one version and one file. The other sixty agree
  # with it after this.
  stamp:
    name: Stamp the version everywhere
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/release/stamp.mjs
      - name: Commit what changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already in step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: stamp the release version into every package and crate"
          git push

  # The PR's own checks never start — its commits are pushed with the
  # workflow token — so CI is run on its branch from here. A red run of this
  # workflow means: do not merge the release PR yet.
  check-release-pr:
    name: CI on the release PR
    needs: [release-please, stamp]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.branch }}

  check-release:
    name: CI on the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish:
    name: Publish
    needs: [release-please, check-release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
