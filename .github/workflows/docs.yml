name: Docs

# The site at harmoniya-net.github.io/opys, built from docs/ with VitePress.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # "Last updated" on a page is read from the history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # Every page translated, heading for heading.
      - run: npm run i18n
        working-directory: docs
      # A dead link fails the build, which is the point of building here.
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every config a page shows is a file under docs/examples, and each is
  # built here. It does not gate the deploy: a build resolves real versions
  # over the network, and a page should not go unpublished because Mojang or
  # GitHub was slow. A red cell is still an example that no longer resolves.
  examples:
    name: Build every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-napi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node docs/check-examples.mjs
