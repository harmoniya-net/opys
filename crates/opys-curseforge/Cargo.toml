[package]
name = "opys-curseforge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CurseForge for opys — mod files by file id, and modpack archives."

[dependencies]
opys-core = { path = "../opys-core", version = "0.2.0" }
opys-dev = { path = "../opys-dev", version = "0.2.0" }
opys-modpack = { path = "../opys-modpack", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
