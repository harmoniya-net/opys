[package]
name = "opys-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "opys build-time SDK. Merges plugin contributions into a Manifest."

[features]
# The blocking `ureq` client. On by default; `opys-dev-napi` turns it off,
# since folding contributions needs no network and the addon ships to npm.
default = ["net"]
net = ["dep:ureq"]

[dependencies]
opys-core = { path = "../opys-core", version = "0.2.0" }
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3", optional = true }
