[package]
name = "opys-minecraft-vanilla"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vanilla Minecraft as manifest artifacts, plus the version-JSON mappers every opys loader reuses."

[dependencies]
opys-core = { workspace = true }
opys-bundle = { workspace = true }
opys-dev = { workspace = true, features = ["net"] }
opys-mojang = { workspace = true }
opys-mojang-rules = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
